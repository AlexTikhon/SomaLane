# Portfolio v1 synthetic dataset (docs/runbooks/portfolio-dataset.md): an isolated PostgreSQL server for the 56-date
# SYNTHETIC dataset of release step 2. Standalone: never layer it on another compose file, and start it only through
# `npm run portfolio:dataset`, which passes the project name and the env file it writes under
# .local/portfolio-dataset/ (ignored by git).
#
# Isolation: its own project name, network, PostgreSQL server (so its own cluster-wide roles), database name and volume.
# The bootstrap script changes cluster-wide roles, which is why a separate database on the development server would not
# be isolated. The only published port is bound to loopback. The tooling proves, before any change, that a connection
# reaches THIS container: it compares the server's system identifier read over TCP with the one read inside the
# container that carries this project's Compose labels (apps/api/src/portfolio-dataset/isolation.ts).
name: somalane-portfolio-dataset

services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:8dfee83d8bd4c2873dc4a233c13ba2799a44f2edb16a0552d58715917fac32ba
    environment:
      POSTGRES_DB: somalane_portfolio_demo
      POSTGRES_USER: somalane_portfolio_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # cluster_name is a visible marker checked by the tooling; the system identifier is the proof.
    command: ["postgres", "-c", "password_encryption=scram-sha-256", "-c", "cluster_name=somalane-portfolio-dataset"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U somalane_portfolio_admin -d somalane_portfolio_demo"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
    ports:
      - "127.0.0.1:${PORTFOLIO_DATASET_PORT:?PORTFOLIO_DATASET_PORT is required; run npm run portfolio:dataset}:5432"
    networks: [data]
    secrets: [postgres_password]
    volumes:
      - portfolio_dataset_postgres:/var/lib/postgresql/data
    restart: "no"
    init: true
    mem_limit: 1g

networks:
  data: {}

secrets:
  postgres_password:
    file: ${PORTFOLIO_DATASET_SECRETS_DIR:?PORTFOLIO_DATASET_SECRETS_DIR is required; run npm run portfolio:dataset}/postgres-password

volumes:
  portfolio_dataset_postgres:
